[project]
name = "macaxeira-learning"
version = "0.1.0"
description = "Digital worker de sourcing para RH, conectado à Nara"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "openai>=1.54",
    "langfuse>=2.53",
    "pandas>=2.2",
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = [
    "eval: avaliações do agente; rode com `pytest avaliacoes -m eval`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".specify", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
